<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Studio — Edit, Annotate & Sign</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13;
    --surface: #16181f;
    --surface2: #1e2029;
    --surface3: #252836;
    --border: #2e3144;
    --accent: #7c6af7;
    --accent2: #f76a8c;
    --accent3: #6af7c0;
    --text: #e8eaf6;
    --text2: #8890b0;
    --text3: #555d80;
    --yellow: #f7c96a;
    --radius: 10px;
    --toolbar-h: 56px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
  }

  #topbar .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.5px;
    margin-right: 8px;
    white-space: nowrap;
  }

  #topbar .logo span { color: var(--accent2); }

  .sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

  .top-btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .top-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--accent); }
  .top-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .top-btn.primary:hover { background: #9580ff; }
  .top-btn svg { flex-shrink: 0; }

  #page-info {
    margin-left: auto;
    font-size: 11px;
    color: var(--text3);
    display: flex; align-items: center; gap: 8px;
  }
  #page-info input {
    width: 36px; height: 24px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    text-align: center;
  }
  #zoom-select {
    height: 26px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text2);
    font-family: inherit;
    font-size: 11px;
    padding: 0 6px;
    cursor: pointer;
  }

  /* ── LAYOUT ── */
  #layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── LEFT SIDEBAR (Tools) ── */
  #sidebar-left {
    width: 52px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 4px;
    flex-shrink: 0;
    z-index: 50;
    overflow-y: auto;
  }

  .tool-btn {
    width: 38px; height: 38px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    position: relative;
    flex-shrink: 0;
  }
  .tool-btn:hover { background: var(--surface3); color: var(--text); }
  .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,247,.2); }
  .tool-btn[title]:hover::after {
    content: attr(title);
    position: absolute;
    left: 46px; top: 50%;
    transform: translateY(-50%);
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 5px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 999;
  }

  .tool-section-label {
    font-size: 8px;
    color: var(--text3);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 8px 0 2px;
    writing-mode: horizontal-tb;
    text-align: center;
    width: 100%;
    padding: 0 4px;
  }

  /* ── CANVAS AREA ── */
  #canvas-area {
    flex: 1;
    overflow: auto;
    background: #080910;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 80px;
    gap: 16px;
    position: relative;
  }

  .page-wrapper {
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
    border-radius: 2px;
    flex-shrink: 0;
  }

  .page-canvas {
    display: block;
    border-radius: 2px;
  }

  .overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    border-radius: 2px;
    cursor: crosshair;
  }

  /* ── RIGHT PANEL ── */
  #panel-right {
    width: 240px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .panel-section {
    border-bottom: 1px solid var(--border);
    padding: 12px;
  }
  .panel-section h3 {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }

  .prop-row {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 8px;
  }
  .prop-row label { font-size: 10px; color: var(--text2); min-width: 60px; }
  .prop-row input[type=color] {
    width: 28px; height: 24px;
    border: none; border-radius: 4px;
    cursor: pointer; padding: 2px;
    background: var(--surface3);
  }
  .prop-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .prop-row select, .prop-row input[type=text] {
    flex: 1; height: 26px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 0 6px;
  }
  .prop-row input[type=number] {
    width: 52px; height: 26px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 0 6px;
    text-align: center;
  }
  .val-label { font-size: 10px; color: var(--text3); min-width: 28px; text-align: right; }

  /* Annotation layers */
  .annotation {
    position: absolute;
    cursor: move;
    user-select: none;
  }
  .annotation.selected::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 2px dashed var(--accent);
    border-radius: 3px;
    pointer-events: none;
  }
  .annotation .del-btn {
    position: absolute;
    top: -10px; right: -10px;
    width: 18px; height: 18px;
    background: var(--accent2);
    border: none; border-radius: 50%;
    color: #fff; font-size: 10px;
    cursor: pointer; display: none;
    align-items: center; justify-content: center;
    line-height: 1; z-index: 10;
  }
  .annotation.selected .del-btn { display: flex; }
  .annotation .resize-handle {
    position: absolute;
    bottom: -5px; right: -5px;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 2px;
    cursor: se-resize;
    display: none;
  }
  .annotation.selected .resize-handle { display: block; }

  .text-annotation {
    min-width: 80px; min-height: 20px;
    padding: 4px 6px;
    border-radius: 3px;
    line-height: 1.4;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Signature canvas overlay */
  #sig-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px);
    z-index: 9999;
    display: none;
    align-items: center; justify-content: center;
  }
  #sig-modal.open { display: flex; }
  #sig-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: min(480px, 95vw);
  }
  #sig-box h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px; margin-bottom: 16px;
    color: var(--text);
  }
  #sig-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .sig-tab {
    flex: 1; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface3);
    color: var(--text2);
    font-family: inherit; font-size: 11px;
    cursor: pointer; transition: all .15s;
  }
  .sig-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #sig-draw-area {
    background: #fff;
    border-radius: 6px;
    cursor: crosshair;
    display: block;
    width: 100%; height: 160px;
  }
  #sig-text-input {
    width: 100%; height: 80px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 28px;
    font-family: 'Dancing Script', cursive, serif;
    padding: 12px;
    text-align: center;
    display: none;
  }
  .sig-actions { display: flex; gap: 8px; margin-top: 14px; }
  .sig-btn {
    flex: 1; height: 36px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface3); color: var(--text2);
    font-family: inherit; font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  .sig-btn:hover { border-color: var(--accent); color: var(--text); }
  .sig-btn.confirm { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sig-btn.confirm:hover { background: #9580ff; }

  /* Drop zone */
  #dropzone {
    position: fixed; inset: 0;
    background: rgba(124,106,247,.12);
    border: 3px dashed var(--accent);
    z-index: 9998;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 24px; color: var(--accent);
  }
  #dropzone.active { display: flex; }

  /* Welcome screen */
  #welcome {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    pointer-events: none;
  }
  #welcome.hidden { display: none; }
  #welcome-inner {
    text-align: center;
    pointer-events: all;
  }
  #welcome h1 {
    font-family: 'Syne', sans-serif;
    font-size: 40px; font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  #welcome h1 em { color: var(--accent); font-style: normal; }
  #welcome p { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
  #open-btn-big {
    display: inline-flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 28px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    box-shadow: 0 4px 24px rgba(124,106,247,.4);
  }
  #open-btn-big:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,106,247,.5); }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 20px;
    font-size: 12px; color: var(--text);
    transition: transform .3s;
    z-index: 9999; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* Highlight annotations */
  .highlight-annotation {
    mix-blend-mode: multiply;
    border-radius: 2px;
  }

  /* Shape annotations */
  .shape-annotation svg { width: 100%; height: 100%; overflow: visible; }

  /* Redact annotation */
  .redact-annotation {
    background: #000 !important;
    border-radius: 2px;
  }

  @media (max-width: 700px) {
    #panel-right { display: none; }
    #sidebar-left { width: 44px; }
    .tool-btn { width: 34px; height: 34px; }
  }
</style>
</head>
<body>

<!-- Drop zone -->
<div id="dropzone">
  <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
    <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6h.1a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Drop PDF here
</div>

<!-- Signature modal -->
<div id="sig-modal">
  <div id="sig-box">
    <h2>Add Signature</h2>
    <div id="sig-tabs">
      <button class="sig-tab active" onclick="switchSigTab('draw')">✏️ Draw</button>
      <button class="sig-tab" onclick="switchSigTab('type')">🔤 Type</button>
    </div>
    <canvas id="sig-draw-area" width="432" height="160"></canvas>
    <input id="sig-text-input" placeholder="Type your signature..." />
    <div class="sig-actions">
      <button class="sig-btn" onclick="clearSig()">Clear</button>
      <button class="sig-btn" onclick="closeSigModal()">Cancel</button>
      <button class="sig-btn confirm" onclick="confirmSig()">Place Signature</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".pdf" style="display:none">

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">PDF<span>Studio</span></span>
  <div class="sep"></div>
  <button class="top-btn" onclick="document.getElementById('file-input').click()">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Open PDF
  </button>
  <button class="top-btn" id="btn-undo" onclick="undo()">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Undo
  </button>
  <button class="top-btn" id="btn-redo" onclick="redo()">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Redo
  </button>
  <div class="sep"></div>
  <button class="top-btn primary" onclick="downloadPDF()">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Download PDF
  </button>
  <div id="page-info">
    <select id="zoom-select" onchange="setZoom(this.value)">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select>
    <span>Page</span>
    <input type="number" id="page-num-input" value="1" min="1" onchange="goToPage(this.value)">
    <span id="total-pages">/ —</span>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div id="layout">

  <!-- LEFT SIDEBAR -->
  <div id="sidebar-left">
    <span class="tool-section-label">Select</span>
    <button class="tool-btn active" id="tool-select" title="Select / Move" onclick="setTool('select')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <span class="tool-section-label">Text</span>
    <button class="tool-btn" id="tool-text" title="Add Text" onclick="setTool('text')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-callout" title="Callout / Comment" onclick="setTool('callout')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <span class="tool-section-label">Draw</span>
    <button class="tool-btn" id="tool-pen" title="Freehand Pen" onclick="setTool('pen')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-highlighter" title="Highlighter" onclick="setTool('highlighter')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-eraser" title="Eraser" onclick="setTool('eraser')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-1.5 1.5M6.5 17.5l10-10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <span class="tool-section-label">Shapes</span>
    <button class="tool-btn" id="tool-rect" title="Rectangle" onclick="setTool('rect')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
    </button>
    <button class="tool-btn" id="tool-circle" title="Circle / Ellipse" onclick="setTool('circle')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="tool-btn" id="tool-line" title="Line / Arrow" onclick="setTool('line')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5M15 5h4v4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <span class="tool-section-label">More</span>
    <button class="tool-btn" id="tool-image" title="Insert Image" onclick="insertImage()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-signature" title="Signature" onclick="openSigModal()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.232 5.232l3.536 3.536M9 11l-6 6v3h3l6-6m0 0l3.536-3.536m-3.536 3.536L12.768 8.464" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-stamp" title="Stamp" onclick="setTool('stamp')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool-btn" id="tool-redact" title="Redact / Black Out" onclick="setTool('redact')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvas-area">
    <div id="welcome">
      <div id="welcome-inner">
        <h1>PDF <em>Studio</em></h1>
        <p>Edit, annotate, sign and download PDF files — all in your browser</p>
        <button id="open-btn-big" onclick="document.getElementById('file-input').click()">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Open a PDF file
        </button>
        <p style="margin-top:14px;font-size:11px;color:var(--text3)">Or drag & drop a PDF anywhere</p>
      </div>
    </div>
    <!-- Pages render here -->
  </div>

  <!-- RIGHT PANEL -->
  <div id="panel-right">
    <div class="panel-section">
      <h3>Tool Options</h3>
      <div id="props-text">
        <div class="prop-row">
          <label>Font</label>
          <select id="prop-font" onchange="updateProp()">
            <option>DM Mono</option>
            <option>Arial</option>
            <option>Times New Roman</option>
            <option>Georgia</option>
            <option>Courier New</option>
            <option>Verdana</option>
          </select>
        </div>
        <div class="prop-row">
          <label>Size</label>
          <input type="number" id="prop-fontsize" value="14" min="6" max="200" onchange="updateProp()">
          <span class="val-label">px</span>
        </div>
        <div class="prop-row">
          <label>Color</label>
          <input type="color" id="prop-color" value="#1a1a2e" onchange="updateProp()">
        </div>
        <div class="prop-row">
          <label>BG</label>
          <input type="color" id="prop-bgcolor" value="#ffff00" onchange="updateProp()">
          <input type="range" id="prop-bgopacity" min="0" max="100" value="0" onchange="updateBgOpacity()">
          <span class="val-label" id="bgop-val">0%</span>
        </div>
        <div class="prop-row">
          <label>Bold</label>
          <input type="checkbox" id="prop-bold" onchange="updateProp()">
          <label style="margin-left:12px">Italic</label>
          <input type="checkbox" id="prop-italic" onchange="updateProp()">
        </div>
      </div>
      <div id="props-draw">
        <div class="prop-row">
          <label>Color</label>
          <input type="color" id="draw-color" value="#e63946" onchange="updateDrawProps()">
        </div>
        <div class="prop-row">
          <label>Width</label>
          <input type="range" id="draw-width" min="1" max="30" value="3" onchange="updateDrawProps()">
          <span class="val-label" id="draw-w-val">3px</span>
        </div>
        <div class="prop-row">
          <label>Opacity</label>
          <input type="range" id="draw-opacity" min="10" max="100" value="100" onchange="updateDrawProps()">
          <span class="val-label" id="draw-op-val">100%</span>
        </div>
      </div>
      <div id="props-stamp">
        <div class="prop-row">
          <label>Stamp</label>
          <select id="stamp-type">
            <option value="APPROVED">✅ APPROVED</option>
            <option value="REJECTED">❌ REJECTED</option>
            <option value="DRAFT">📝 DRAFT</option>
            <option value="CONFIDENTIAL">🔒 CONFIDENTIAL</option>
            <option value="REVIEWED">👁 REVIEWED</option>
            <option value="VOID">⚠️ VOID</option>
            <option value="COPY">📋 COPY</option>
          </select>
        </div>
        <div class="prop-row">
          <label>Color</label>
          <input type="color" id="stamp-color" value="#e63946">
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Annotations</h3>
      <div id="annotations-list" style="max-height:200px;overflow-y:auto;font-size:11px;color:var(--text2)">
        <div style="color:var(--text3);font-size:10px">No annotations yet</div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Document Info</h3>
      <div id="doc-info" style="font-size:11px;color:var(--text2);line-height:2">
        <div>Pages: <span id="info-pages">—</span></div>
        <div>Size: <span id="info-size">—</span></div>
        <div>File: <span id="info-filename" style="word-break:break-all">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── STATE ──────────────────────────────────────────────────────
let pdfDoc = null, pdfLibDoc = null, pdfBytes = null;
let totalPages = 0, currentZoom = 1;
let currentTool = 'select';
let annotations = []; // {id, page, el, type, data}
let selectedAnnotation = null;
let undoStack = [], redoStack = [];
let sigMode = 'draw', sigCtx, sigDrawing = false;
let drawState = { drawing: false, startX: 0, startY: 0, tempEl: null };
let fileName = 'document';

// Draw props
let drawColor = '#e63946', drawWidth = 3, drawOpacity = 1;
let penPoints = [], penEl = null;

// ── FILE HANDLING ──────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
  e.target.value = '';
});

// Drag & drop
document.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('dropzone').classList.add('active'); });
document.addEventListener('dragleave', e => { if (e.relatedTarget == null) document.getElementById('dropzone').classList.remove('active'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('active');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') loadFile(f);
  else if (f) toast('Please drop a PDF file');
});

async function loadFile(file) {
  fileName = file.name.replace('.pdf','');
  document.getElementById('info-filename').textContent = file.name;
  document.getElementById('info-size').textContent = (file.size/1024).toFixed(1)+' KB';
  const arrBuf = await file.arrayBuffer();
  pdfBytes = new Uint8Array(arrBuf);
  pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
  pdfDoc = await pdfjsLib.getDocument({data: pdfBytes.slice()}).promise;
  totalPages = pdfDoc.numPages;
  document.getElementById('total-pages').textContent = '/ ' + totalPages;
  document.getElementById('page-num-input').max = totalPages;
  document.getElementById('info-pages').textContent = totalPages;
  annotations = []; undoStack = []; redoStack = [];
  document.getElementById('welcome').classList.add('hidden');
  await renderAllPages();
  toast('PDF loaded — ' + totalPages + ' page' + (totalPages>1?'s':''));
}

async function renderAllPages() {
  const area = document.getElementById('canvas-area');
  // Remove old pages
  area.querySelectorAll('.page-wrapper').forEach(el => el.remove());
  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({scale: currentZoom});
    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';
    wrapper.dataset.page = i;
    wrapper.style.width = vp.width + 'px';
    wrapper.style.height = vp.height + 'px';
    const canvas = document.createElement('canvas');
    canvas.className = 'page-canvas';
    canvas.width = vp.width; canvas.height = vp.height;
    const overlay = document.createElement('canvas');
    overlay.className = 'overlay-canvas';
    overlay.width = vp.width; overlay.height = vp.height;
    overlay.dataset.page = i;
    wrapper.appendChild(canvas);
    wrapper.appendChild(overlay);
    area.appendChild(wrapper);
    page.render({canvasContext: canvas.getContext('2d'), viewport: vp});
    attachOverlayEvents(overlay, i, vp.width, vp.height);
  }
  // Re-attach existing annotations
  annotations.forEach(ann => {
    const wrapper = area.querySelector(`.page-wrapper[data-page="${ann.page}"]`);
    if (wrapper && !wrapper.contains(ann.el)) wrapper.appendChild(ann.el);
  });
}

function setZoom(val) {
  currentZoom = parseFloat(val);
  renderAllPages();
}
function goToPage(num) {
  const pg = Math.max(1, Math.min(totalPages, parseInt(num)));
  const wrapper = document.querySelector(`.page-wrapper[data-page="${pg}"]`);
  if (wrapper) wrapper.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── TOOLS ─────────────────────────────────────────────────────
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + t);
  if (btn) btn.classList.add('active');

  // Update canvas cursors
  document.querySelectorAll('.overlay-canvas').forEach(ov => {
    if (['pen','highlighter'].includes(t)) ov.style.cursor = 'crosshair';
    else if (t === 'eraser') ov.style.cursor = 'cell';
    else if (t === 'select') ov.style.cursor = 'default';
    else ov.style.cursor = 'crosshair';
  });

  // Panel visibility
  const showText = ['text','callout'].includes(t);
  const showDraw = ['pen','highlighter','eraser','rect','circle','line','redact'].includes(t);
  const showStamp = t === 'stamp';
  document.getElementById('props-text').style.display = showText ? '' : 'none';
  document.getElementById('props-draw').style.display = showDraw ? '' : 'none';
  document.getElementById('props-stamp').style.display = showStamp ? '' : 'none';
  if (!showText && !showDraw && !showStamp) {
    document.getElementById('props-text').style.display = 'none';
    document.getElementById('props-draw').style.display = 'none';
    document.getElementById('props-stamp').style.display = 'none';
  }
}

// init panel state
setTool('select');

// ── OVERLAY EVENTS ─────────────────────────────────────────────
function attachOverlayEvents(overlay, pageNum, w, h) {
  overlay.addEventListener('mousedown', e => onOverlayDown(e, overlay, pageNum));
  overlay.addEventListener('mousemove', e => onOverlayMove(e, overlay, pageNum));
  overlay.addEventListener('mouseup', e => onOverlayUp(e, overlay, pageNum));
  overlay.addEventListener('click', e => onOverlayClick(e, overlay, pageNum));
  // Touch
  overlay.addEventListener('touchstart', e => { const t = e.touches[0]; onOverlayDown(t, overlay, pageNum); }, {passive:true});
  overlay.addEventListener('touchmove', e => { const t = e.touches[0]; onOverlayMove(t, overlay, pageNum); e.preventDefault(); }, {passive:false});
  overlay.addEventListener('touchend', e => { const t = e.changedTouches[0]; onOverlayUp(t, overlay, pageNum); }, {passive:true});
}

function getPos(e, overlay) {
  const r = overlay.getBoundingClientRect();
  return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
}

function onOverlayDown(e, overlay, pageNum) {
  const pos = getPos(e, overlay);
  if (currentTool === 'pen' || currentTool === 'highlighter') {
    drawState.drawing = true;
    penPoints = [pos];
    penEl = null;
  } else if (['rect','circle','line','redact'].includes(currentTool)) {
    drawState.drawing = true;
    drawState.startX = pos.x; drawState.startY = pos.y;
  }
}

function onOverlayMove(e, overlay, pageNum) {
  const pos = getPos(e, overlay);
  if (!drawState.drawing) return;

  if (currentTool === 'pen' || currentTool === 'highlighter') {
    penPoints.push(pos);
    drawPenPreview(overlay, pageNum);
  } else if (['rect','circle','line','redact'].includes(currentTool)) {
    drawShapePreview(overlay, pos, pageNum);
  }
}

function onOverlayUp(e, overlay, pageNum) {
  const pos = getPos(e, overlay);
  if (!drawState.drawing) return;
  drawState.drawing = false;

  if (currentTool === 'pen' || currentTool === 'highlighter') {
    if (penPoints.length < 2) return;
    finishPenStroke(pageNum);
  } else if (['rect','circle','line','redact'].includes(currentTool)) {
    if (drawState.tempEl) { drawState.tempEl.remove(); drawState.tempEl = null; }
    const x = Math.min(drawState.startX, pos.x);
    const y = Math.min(drawState.startY, pos.y);
    const w = Math.abs(pos.x - drawState.startX);
    const h2 = Math.abs(pos.y - drawState.startY);
    if (w < 5 && h2 < 5) return;
    addShapeAnnotation(currentTool, pageNum, x, y, w, h2, drawState.startX, drawState.startY, pos.x, pos.y);
  }
}

function onOverlayClick(e, overlay, pageNum) {
  const pos = getPos(e, overlay);
  if (currentTool === 'select') {
    deselectAll();
  } else if (currentTool === 'text' || currentTool === 'callout') {
    addTextAnnotation(pageNum, pos.x, pos.y);
  } else if (currentTool === 'eraser') {
    eraseAt(pos, pageNum);
  } else if (currentTool === 'stamp') {
    addStampAnnotation(pageNum, pos.x, pos.y);
  }
}

// ── PEN / HIGHLIGHTER ─────────────────────────────────────────
function drawPenPreview(overlay, pageNum) {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.save();
  ctx.strokeStyle = drawColor;
  ctx.lineWidth = currentTool === 'highlighter' ? drawWidth * 5 : drawWidth;
  ctx.globalAlpha = currentTool === 'highlighter' ? 0.4 : drawOpacity;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (penPoints.length) { ctx.moveTo(penPoints[0].x, penPoints[0].y); penPoints.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); }
  ctx.stroke();
  ctx.restore();
}

function finishPenStroke(pageNum) {
  const overlay = document.querySelector(`.overlay-canvas[data-page="${pageNum}"]`);
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const wrapper = overlay.closest('.page-wrapper');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.position = 'absolute';
  svg.style.top = '0'; svg.style.left = '0';
  svg.style.width = overlay.width+'px'; svg.style.height = overlay.height+'px';
  svg.style.pointerEvents = 'none';
  svg.style.overflow = 'visible';

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  let d = `M ${penPoints[0].x} ${penPoints[0].y}`;
  for (let i = 1; i < penPoints.length; i++) d += ` L ${penPoints[i].x} ${penPoints[i].y}`;
  path.setAttribute('d', d);
  path.setAttribute('stroke', drawColor);
  path.setAttribute('stroke-width', currentTool === 'highlighter' ? drawWidth*5 : drawWidth);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  path.setAttribute('fill', 'none');
  path.setAttribute('opacity', currentTool === 'highlighter' ? '0.4' : drawOpacity);
  svg.appendChild(path);
  wrapper.appendChild(svg);

  const id = genId();
  const ann = {id, page: pageNum, el: svg, type: currentTool === 'highlighter' ? 'highlight' : 'pen', data: {points: [...penPoints], color: drawColor, width: drawWidth, opacity: drawOpacity, tool: currentTool}};
  annotations.push(ann);
  pushUndo({action:'add', ann});
  updateAnnotationsList();
  penPoints = [];
}

// ── SHAPE ANNOTATIONS ─────────────────────────────────────────
function drawShapePreview(overlay, pos, pageNum) {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.save();
  ctx.strokeStyle = drawColor;
  ctx.lineWidth = drawWidth;
  ctx.globalAlpha = drawOpacity;
  const x = Math.min(drawState.startX, pos.x);
  const y = Math.min(drawState.startY, pos.y);
  const w = Math.abs(pos.x - drawState.startX);
  const h = Math.abs(pos.y - drawState.startY);
  if (currentTool === 'rect') { ctx.strokeRect(x, y, w, h); }
  else if (currentTool === 'circle') { ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2); ctx.stroke(); }
  else if (currentTool === 'line') { ctx.beginPath(); ctx.moveTo(drawState.startX, drawState.startY); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
  else if (currentTool === 'redact') { ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h); }
  ctx.restore();
}

function addShapeAnnotation(type, pageNum, x, y, w, h, sx, sy, ex, ey) {
  const overlay = document.querySelector(`.overlay-canvas[data-page="${pageNum}"]`);
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const wrapper = overlay.closest('.page-wrapper');
  const div = document.createElement('div');
  div.className = 'annotation shape-annotation';
  div.style.left = x + 'px'; div.style.top = y + 'px';
  div.style.width = Math.max(w, 10) + 'px'; div.style.height = Math.max(h, 10) + 'px';

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${Math.max(w,10)} ${Math.max(h,10)}`);
  svg.style.overflow = 'visible';

  if (type === 'rect') {
    const el = document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('x','1'); el.setAttribute('y','1');
    el.setAttribute('width', Math.max(w,10)-2); el.setAttribute('height', Math.max(h,10)-2);
    el.setAttribute('stroke', drawColor); el.setAttribute('stroke-width', drawWidth);
    el.setAttribute('fill', 'none'); el.setAttribute('opacity', drawOpacity);
    svg.appendChild(el);
  } else if (type === 'circle') {
    const el = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    el.setAttribute('cx', Math.max(w,10)/2); el.setAttribute('cy', Math.max(h,10)/2);
    el.setAttribute('rx', Math.max(w,10)/2-1); el.setAttribute('ry', Math.max(h,10)/2-1);
    el.setAttribute('stroke', drawColor); el.setAttribute('stroke-width', drawWidth);
    el.setAttribute('fill', 'none'); el.setAttribute('opacity', drawOpacity);
    svg.appendChild(el);
  } else if (type === 'line') {
    const el = document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('x1', sx-x); el.setAttribute('y1', sy-y);
    el.setAttribute('x2', ex-x); el.setAttribute('y2', ey-y);
    el.setAttribute('stroke', drawColor); el.setAttribute('stroke-width', drawWidth);
    el.setAttribute('marker-end','url(#arrowhead)');
    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id','arrowhead'); marker.setAttribute('markerWidth','8'); marker.setAttribute('markerHeight','8');
    marker.setAttribute('refX','6'); marker.setAttribute('refY','3'); marker.setAttribute('orient','auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points','0 0, 8 3, 0 6'); poly.setAttribute('fill', drawColor);
    marker.appendChild(poly); defs.appendChild(marker); svg.appendChild(defs);
    el.setAttribute('opacity', drawOpacity); svg.appendChild(el);
  } else if (type === 'redact') {
    div.classList.add('redact-annotation');
    div.style.background = '#000';
  }

  if (type !== 'redact') div.appendChild(svg);
  makeDraggable(div);
  addDeleteHandle(div);
  addResizeHandle(div);
  div.addEventListener('click', e => { e.stopPropagation(); selectAnnotation(ann); });
  wrapper.appendChild(div);

  const id = genId();
  const ann = {id, page: pageNum, el: div, type, data: {x,y,w,h,sx,sy,ex,ey,color:drawColor,width:drawWidth,opacity:drawOpacity}};
  ann.el = div;
  annotations.push(ann);
  pushUndo({action:'add', ann});
  updateAnnotationsList();
}

// ── TEXT ANNOTATION ───────────────────────────────────────────
function addTextAnnotation(pageNum, x, y) {
  const wrapper = document.querySelector(`.page-wrapper[data-page="${pageNum}"]`);
  const div = document.createElement('div');
  div.className = 'annotation text-annotation';
  div.contentEditable = true;
  div.style.left = x + 'px'; div.style.top = y + 'px';
  applyTextProps(div);
  div.textContent = 'Text here';

  if (currentTool === 'callout') {
    div.style.background = 'rgba(255,255,200,0.92)';
    div.style.border = '1px solid #c8a000';
    div.style.borderRadius = '4px';
    div.style.padding = '6px 8px';
    div.style.boxShadow = '2px 2px 8px rgba(0,0,0,.2)';
  }

  makeDraggable(div);
  addDeleteHandle(div);
  addResizeHandle(div);
  div.addEventListener('focus', () => selectAnnotation(ann));
  div.addEventListener('click', e => { e.stopPropagation(); selectAnnotation(ann); });
  wrapper.appendChild(div);
  div.focus(); selectAll(div);

  const id = genId();
  const ann = {id, page: pageNum, el: div, type: 'text', data: {}};
  annotations.push(ann);
  pushUndo({action:'add', ann});
  updateAnnotationsList();
  selectAnnotation(ann);
}

function selectAll(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
}

function applyTextProps(el) {
  const font = document.getElementById('prop-font').value;
  const size = document.getElementById('prop-fontsize').value;
  const color = document.getElementById('prop-color').value;
  const bold = document.getElementById('prop-bold').checked;
  const italic = document.getElementById('prop-italic').checked;
  el.style.fontFamily = font;
  el.style.fontSize = size + 'px';
  el.style.color = color;
  el.style.fontWeight = bold ? 'bold' : 'normal';
  el.style.fontStyle = italic ? 'italic' : 'normal';
}

function updateProp() {
  if (selectedAnnotation && selectedAnnotation.type === 'text') {
    applyTextProps(selectedAnnotation.el);
  }
}

function updateBgOpacity() {
  const val = document.getElementById('prop-bgopacity').value;
  document.getElementById('bgop-val').textContent = val + '%';
  if (selectedAnnotation && selectedAnnotation.type === 'text') {
    const color = document.getElementById('prop-bgcolor').value;
    const hex = color.replace('#','');
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    selectedAnnotation.el.style.background = `rgba(${r},${g},${b},${val/100})`;
  }
}

function updateDrawProps() {
  drawColor = document.getElementById('draw-color').value;
  drawWidth = parseInt(document.getElementById('draw-width').value);
  drawOpacity = parseInt(document.getElementById('draw-opacity').value) / 100;
  document.getElementById('draw-w-val').textContent = drawWidth + 'px';
  document.getElementById('draw-op-val').textContent = Math.round(drawOpacity*100) + '%';
}

// ── STAMP ANNOTATION ──────────────────────────────────────────
function addStampAnnotation(pageNum, x, y) {
  const wrapper = document.querySelector(`.page-wrapper[data-page="${pageNum}"]`);
  const type = document.getElementById('stamp-type').value;
  const color = document.getElementById('stamp-color').value;

  const div = document.createElement('div');
  div.className = 'annotation';
  div.style.left = (x-60) + 'px'; div.style.top = (y-18) + 'px';
  div.style.padding = '4px 12px';
  div.style.border = `2px solid ${color}`;
  div.style.borderRadius = '4px';
  div.style.color = color;
  div.style.fontFamily = 'Syne, sans-serif';
  div.style.fontWeight = '700';
  div.style.fontSize = '16px';
  div.style.letterSpacing = '2px';
  div.style.transform = 'rotate(-15deg)';
  div.style.background = 'rgba(255,255,255,0.05)';
  div.style.whiteSpace = 'nowrap';
  div.textContent = type;

  makeDraggable(div);
  addDeleteHandle(div);
  div.addEventListener('click', e => { e.stopPropagation(); selectAnnotation(ann); });
  wrapper.appendChild(div);

  const id = genId();
  const ann = {id, page: pageNum, el: div, type: 'stamp', data: {stampType: type, color}};
  annotations.push(ann);
  pushUndo({action:'add', ann});
  updateAnnotationsList();
}

// ── IMAGE INSERT ──────────────────────────────────────────────
function insertImage() {
  if (!pdfDoc) { toast('Open a PDF first'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const url = URL.createObjectURL(file);
    const pageNum = getCurrentVisiblePage();
    const wrapper = document.querySelector(`.page-wrapper[data-page="${pageNum}"]`);

    const div = document.createElement('div');
    div.className = 'annotation';
    div.style.left = '80px'; div.style.top = '80px';
    div.style.width = '200px'; div.style.height = 'auto';
    const img = document.createElement('img');
    img.src = url; img.style.width = '100%'; img.style.display = 'block';
    img.style.borderRadius = '3px';
    div.appendChild(img);

    makeDraggable(div);
    addDeleteHandle(div);
    addResizeHandle(div);
    div.addEventListener('click', e => { e.stopPropagation(); selectAnnotation(ann); });
    wrapper.appendChild(div);

    const id = genId();
    const ann = {id, page: pageNum, el: div, type: 'image', data: {src: url, file}};
    annotations.push(ann);
    pushUndo({action:'add', ann});
    updateAnnotationsList();
    toast('Image inserted — drag to reposition');
  };
  inp.click();
}

// ── SIGNATURE ─────────────────────────────────────────────────
function openSigModal() {
  if (!pdfDoc) { toast('Open a PDF first'); return; }
  document.getElementById('sig-modal').classList.add('open');
  const c = document.getElementById('sig-draw-area');
  sigCtx = c.getContext('2d');
  sigCtx.clearRect(0, 0, c.width, c.height);
  sigCtx.strokeStyle = '#1a1a2e'; sigCtx.lineWidth = 2; sigCtx.lineCap = 'round';

  c.onmousedown = e => { sigDrawing = true; sigCtx.beginPath(); const r = c.getBoundingClientRect(); sigCtx.moveTo(e.clientX-r.left, e.clientY-r.top); };
  c.onmousemove = e => { if (!sigDrawing) return; const r = c.getBoundingClientRect(); sigCtx.lineTo(e.clientX-r.left, e.clientY-r.top); sigCtx.stroke(); };
  c.onmouseup = () => sigDrawing = false;
  c.ontouchstart = e => { sigDrawing=true; sigCtx.beginPath(); const r=c.getBoundingClientRect(), t=e.touches[0]; sigCtx.moveTo(t.clientX-r.left, t.clientY-r.top); e.preventDefault(); };
  c.ontouchmove = e => { if(!sigDrawing) return; const r=c.getBoundingClientRect(), t=e.touches[0]; sigCtx.lineTo(t.clientX-r.left, t.clientY-r.top); sigCtx.stroke(); e.preventDefault(); };
  c.ontouchend = ()=>sigDrawing=false;
}

function switchSigTab(mode) {
  sigMode = mode;
  document.querySelectorAll('.sig-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sig-draw-area').style.display = mode==='draw' ? 'block' : 'none';
  document.getElementById('sig-text-input').style.display = mode==='type' ? 'block' : 'none';
}

function clearSig() {
  if (sigMode === 'draw') { sigCtx.clearRect(0,0,432,160); }
  else document.getElementById('sig-text-input').value = '';
}

function closeSigModal() { document.getElementById('sig-modal').classList.remove('open'); }

function confirmSig() {
  let dataUrl;
  if (sigMode === 'draw') {
    const c = document.getElementById('sig-draw-area');
    dataUrl = c.toDataURL();
  } else {
    const text = document.getElementById('sig-text-input').value.trim();
    if (!text) { toast('Please draw or type a signature'); return; }
    const c = document.createElement('canvas'); c.width=340; c.height=100;
    const ctx = c.getContext('2d');
    ctx.font = '52px "Dancing Script", cursive';
    ctx.fillStyle = '#1a1a2e';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 170, 50);
    dataUrl = c.toDataURL();
  }
  closeSigModal();
  placeSigOnPage(dataUrl);
}

function placeSigOnPage(dataUrl) {
  const pageNum = getCurrentVisiblePage();
  const wrapper = document.querySelector(`.page-wrapper[data-page="${pageNum}"]`);
  const div = document.createElement('div');
  div.className = 'annotation';
  div.style.left = '100px'; div.style.top = '200px';
  div.style.width = '180px';
  const img = document.createElement('img');
  img.src = dataUrl; img.style.width = '100%'; img.style.display = 'block';
  div.appendChild(img);
  makeDraggable(div);
  addDeleteHandle(div);
  addResizeHandle(div);
  div.addEventListener('click', e => { e.stopPropagation(); selectAnnotation(ann); });
  wrapper.appendChild(div);

  const id = genId();
  const ann = {id, page: pageNum, el: div, type: 'signature', data: {dataUrl}};
  annotations.push(ann);
  pushUndo({action:'add', ann});
  updateAnnotationsList();
  toast('Signature placed — drag to reposition');
}

// ── ERASER ────────────────────────────────────────────────────
function eraseAt(pos, pageNum) {
  const toRemove = annotations.filter(ann => {
    if (ann.page !== pageNum) return false;
    const el = ann.el;
    const x = parseFloat(el.style.left||0), y = parseFloat(el.style.top||0);
    const w = el.offsetWidth, h = el.offsetHeight;
    return pos.x >= x && pos.x <= x+w && pos.y >= y && pos.y <= y+h;
  });
  toRemove.forEach(ann => {
    ann.el.remove();
    annotations = annotations.filter(a => a.id !== ann.id);
    pushUndo({action:'remove', ann});
  });
  if (toRemove.length) updateAnnotationsList();
}

// ── SELECTION ─────────────────────────────────────────────────
function selectAnnotation(ann) {
  deselectAll();
  selectedAnnotation = ann;
  ann.el.classList.add('selected');
  // Populate props if text
  if (ann.type === 'text') {
    document.getElementById('prop-font').value = ann.el.style.fontFamily.split(',')[0].trim() || 'DM Mono';
    document.getElementById('prop-fontsize').value = parseInt(ann.el.style.fontSize) || 14;
    document.getElementById('prop-color').value = rgbToHex(ann.el.style.color) || '#1a1a2e';
    document.getElementById('prop-bold').checked = ann.el.style.fontWeight === 'bold';
    document.getElementById('prop-italic').checked = ann.el.style.fontStyle === 'italic';
  }
}

function deselectAll() {
  selectedAnnotation = null;
  document.querySelectorAll('.annotation.selected').forEach(el => el.classList.remove('selected'));
}

document.getElementById('canvas-area').addEventListener('click', e => {
  if (e.target.classList.contains('overlay-canvas') || e.target === document.getElementById('canvas-area')) deselectAll();
});

function rgbToHex(rgb) {
  if (!rgb) return '#000000';
  if (rgb.startsWith('#')) return rgb;
  const r = rgb.match(/\d+/g);
  if (!r) return '#000000';
  return '#' + r.slice(0,3).map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
}

// ── DRAG ──────────────────────────────────────────────────────
function makeDraggable(el) {
  let ox, oy, startL, startT, dragging = false;
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('del-btn') || e.target.classList.contains('resize-handle')) return;
    if (e.target.isContentEditable || e.target.closest('[contenteditable]')) return;
    e.stopPropagation(); e.preventDefault();
    dragging = true;
    ox = e.clientX; oy = e.clientY;
    startL = parseFloat(el.style.left||0); startT = parseFloat(el.style.top||0);
    el.style.zIndex = 1000;
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    el.style.left = (startL + e.clientX - ox) + 'px';
    el.style.top = (startT + e.clientY - oy) + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; el.style.zIndex = ''; });
  // Touch
  el.addEventListener('touchstart', e => {
    if (e.target.classList.contains('del-btn') || e.target.classList.contains('resize-handle')) return;
    dragging = true; const t = e.touches[0];
    ox = t.clientX; oy = t.clientY;
    startL = parseFloat(el.style.left||0); startT = parseFloat(el.style.top||0);
    el.style.zIndex = 1000;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (!dragging) return; const t = e.touches[0];
    el.style.left = (startL + t.clientX - ox) + 'px';
    el.style.top = (startT + t.clientY - oy) + 'px';
  }, {passive:true});
  document.addEventListener('touchend', () => { dragging = false; el.style.zIndex = ''; });
}

function addDeleteHandle(el) {
  const btn = document.createElement('button');
  btn.className = 'del-btn'; btn.textContent = '×';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const ann = annotations.find(a => a.el === el);
    if (ann) {
      el.remove();
      annotations = annotations.filter(a => a.id !== ann.id);
      pushUndo({action:'remove', ann});
      updateAnnotationsList();
      selectedAnnotation = null;
    }
  });
  el.appendChild(btn);
}

function addResizeHandle(el) {
  const h = document.createElement('div');
  h.className = 'resize-handle';
  let resizing = false, ox, oy, sw, sh;
  h.addEventListener('mousedown', e => {
    e.stopPropagation(); e.preventDefault();
    resizing = true; ox = e.clientX; oy = e.clientY;
    sw = el.offsetWidth; sh = el.offsetHeight;
  });
  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    el.style.width = Math.max(40, sw + e.clientX - ox) + 'px';
    if (!el.querySelector('img')) el.style.height = Math.max(20, sh + e.clientY - oy) + 'px';
  });
  document.addEventListener('mouseup', () => resizing = false);
  el.appendChild(h);
}

// ── UNDO/REDO ─────────────────────────────────────────────────
function pushUndo(action) {
  undoStack.push(action);
  redoStack = [];
}

function undo() {
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  const action = undoStack.pop();
  redoStack.push(action);
  if (action.action === 'add') {
    action.ann.el.remove();
    annotations = annotations.filter(a => a.id !== action.ann.id);
  } else if (action.action === 'remove') {
    const wrapper = document.querySelector(`.page-wrapper[data-page="${action.ann.page}"]`);
    if (wrapper) wrapper.appendChild(action.ann.el);
    annotations.push(action.ann);
  }
  updateAnnotationsList();
  toast('Undo');
}

function redo() {
  if (!redoStack.length) { toast('Nothing to redo'); return; }
  const action = redoStack.pop();
  undoStack.push(action);
  if (action.action === 'add') {
    const wrapper = document.querySelector(`.page-wrapper[data-page="${action.ann.page}"]`);
    if (wrapper) wrapper.appendChild(action.ann.el);
    annotations.push(action.ann);
  } else if (action.action === 'remove') {
    action.ann.el.remove();
    annotations = annotations.filter(a => a.id !== action.ann.id);
  }
  updateAnnotationsList();
  toast('Redo');
}

// ── DOWNLOAD PDF ──────────────────────────────────────────────
async function downloadPDF() {
  if (!pdfLibDoc) { toast('Open a PDF first'); return; }
  toast('Preparing PDF…');

  try {
    // Re-load fresh copy
    const freshDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const pages = freshDoc.getPages();
    const font = await freshDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const boldFont = await freshDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

    for (const ann of annotations) {
      const pdfPage = pages[ann.page - 1];
      if (!pdfPage) continue;
      const { width: pw, height: ph } = pdfPage.getSize();
      const wrapper = document.querySelector(`.page-wrapper[data-page="${ann.page}"]`);
      if (!wrapper) continue;
      const ww = wrapper.offsetWidth, wh = wrapper.offsetHeight;
      const scaleX = pw / ww, scaleY = ph / wh;

      const el = ann.el;
      const elX = parseFloat(el.style.left || 0);
      const elY = parseFloat(el.style.top || 0);
      const elW = el.offsetWidth;
      const elH = el.offsetHeight;

      // PDF coords: bottom-left origin
      const pdfX = elX * scaleX;
      const pdfY = ph - (elY * scaleY) - (elH * scaleY);

      if (ann.type === 'text' || ann.type === 'callout') {
        const text = el.innerText || el.textContent || '';
        const fontSize = (parseFloat(el.style.fontSize) || 14) * scaleX;
        const bold = el.style.fontWeight === 'bold';
        const color = hexToRgb01(rgbToHex(el.style.color) || '#000000');
        const lines = text.split('\n');
        let yOff = 0;
        for (const line of lines) {
          if (!line.trim()) { yOff += fontSize * 1.4; continue; }
          pdfPage.drawText(line, {
            x: pdfX, y: pdfY - yOff + (elH * scaleY) - fontSize,
            size: Math.max(6, fontSize),
            font: bold ? boldFont : font,
            color: PDFLib.rgb(color[0], color[1], color[2]),
            maxWidth: elW * scaleX,
          });
          yOff += fontSize * 1.4;
        }
      }

      else if (ann.type === 'pen' || ann.type === 'highlight') {
        const pts = ann.data.points;
        if (pts.length < 2) continue;
        const col = hexToRgb01(ann.data.color);
        const lw = ann.data.width * ((scaleX + scaleY)/2);
        const op = ann.data.opacity;
        const isHL = ann.type === 'highlight';
        for (let i = 0; i < pts.length - 1; i++) {
          pdfPage.drawLine({
            start: { x: pts[i].x * scaleX, y: ph - pts[i].y * scaleY },
            end:   { x: pts[i+1].x * scaleX, y: ph - pts[i+1].y * scaleY },
            thickness: isHL ? lw * 5 : lw,
            color: PDFLib.rgb(col[0], col[1], col[2]),
            opacity: isHL ? 0.4 : op,
          });
        }
      }

      else if (ann.type === 'rect') {
        const col = hexToRgb01(ann.data.color);
        pdfPage.drawRectangle({
          x: pdfX, y: pdfY,
          width: elW * scaleX, height: elH * scaleY,
          borderColor: PDFLib.rgb(col[0], col[1], col[2]),
          borderWidth: ann.data.width * ((scaleX+scaleY)/2),
          opacity: ann.data.opacity,
        });
      }

      else if (ann.type === 'circle') {
        const col = hexToRgb01(ann.data.color);
        pdfPage.drawEllipse({
          x: pdfX + (elW*scaleX/2), y: pdfY + (elH*scaleY/2),
          xScale: elW * scaleX / 2, yScale: elH * scaleY / 2,
          borderColor: PDFLib.rgb(col[0], col[1], col[2]),
          borderWidth: ann.data.width * ((scaleX+scaleY)/2),
          opacity: ann.data.opacity,
        });
      }

      else if (ann.type === 'redact') {
        pdfPage.drawRectangle({
          x: pdfX, y: pdfY,
          width: elW * scaleX, height: elH * scaleY,
          color: PDFLib.rgb(0, 0, 0),
        });
      }

      else if (ann.type === 'stamp') {
        const col = hexToRgb01(ann.data.color);
        const stampText = ann.data.stampType;
        const sz = 16 * scaleX;
        pdfPage.drawText(stampText, {
          x: pdfX, y: pdfY,
          size: sz,
          font: boldFont,
          color: PDFLib.rgb(col[0], col[1], col[2]),
          rotate: PDFLib.degrees(-15),
        });
        pdfPage.drawRectangle({
          x: pdfX - 4*scaleX, y: pdfY - 4*scaleY,
          width: (elW + 8) * scaleX, height: (elH + 8) * scaleY,
          borderColor: PDFLib.rgb(col[0], col[1], col[2]),
          borderWidth: 1.5,
          opacity: 0.7,
        });
      }

      else if (ann.type === 'signature' || ann.type === 'image') {
        try {
          const src = ann.data.dataUrl || ann.data.src;
          const resp = await fetch(src);
          const buf = await resp.arrayBuffer();
          let emb;
          if (src.includes('png') || src.startsWith('data:image/png')) emb = await freshDoc.embedPng(buf);
          else emb = await freshDoc.embedJpg(buf);
          pdfPage.drawImage(emb, { x: pdfX, y: pdfY, width: elW * scaleX, height: elH * scaleY });
        } catch(imgErr) { console.warn('Image embed failed', imgErr); }
      }

      else if (ann.type === 'line') {
        const col = hexToRgb01(ann.data.color);
        pdfPage.drawLine({
          start: { x: ann.data.sx * scaleX, y: ph - ann.data.sy * scaleY },
          end:   { x: ann.data.ex * scaleX, y: ph - ann.data.ey * scaleY },
          thickness: ann.data.width * ((scaleX+scaleY)/2),
          color: PDFLib.rgb(col[0], col[1], col[2]),
          opacity: ann.data.opacity,
        });
      }
    }

    const outBytes = await freshDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName + '_edited.pdf';
    a.click();
    toast('PDF downloaded!');
  } catch(err) {
    console.error(err);
    toast('Error saving PDF: ' + err.message);
  }
}

function hexToRgb01(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return [r,g,b];
}

// ── HELPERS ───────────────────────────────────────────────────
function genId() { return Math.random().toString(36).slice(2); }

function getCurrentVisiblePage() {
  const area = document.getElementById('canvas-area');
  const areaRect = area.getBoundingClientRect();
  const wrappers = document.querySelectorAll('.page-wrapper');
  let best = 1, bestVis = -1;
  wrappers.forEach(w => {
    const r = w.getBoundingClientRect();
    const visible = Math.max(0, Math.min(r.bottom, areaRect.bottom) - Math.max(r.top, areaRect.top));
    if (visible > bestVis) { bestVis = visible; best = parseInt(w.dataset.page); }
  });
  return best;
}

function updateAnnotationsList() {
  const list = document.getElementById('annotations-list');
  if (!annotations.length) { list.innerHTML = '<div style="color:var(--text3);font-size:10px">No annotations yet</div>'; return; }
  list.innerHTML = annotations.map(a => `
    <div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:10px;color:var(--text3);min-width:16px">${a.page}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text2)">${a.type}</span>
      <button onclick="removeAnnotationById('${a.id}')" style="background:none;border:none;color:var(--accent2);cursor:pointer;font-size:12px;padding:0">×</button>
    </div>
  `).join('');
}

function removeAnnotationById(id) {
  const ann = annotations.find(a => a.id === id);
  if (!ann) return;
  ann.el.remove();
  annotations = annotations.filter(a => a.id !== id);
  pushUndo({action:'remove', ann});
  updateAnnotationsList();
}

// Scroll page indicator
document.getElementById('canvas-area').addEventListener('scroll', () => {
  const pg = getCurrentVisiblePage();
  document.getElementById('page-num-input').value = pg;
});

// Toast
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) { e.preventDefault(); undo(); }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey) && e.shiftKey) { e.preventDefault(); redo(); }
  if (e.key === 'y' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); redo(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedAnnotation && !document.activeElement.isContentEditable) {
      const ann = selectedAnnotation;
      ann.el.remove();
      annotations = annotations.filter(a => a.id !== ann.id);
      pushUndo({action:'remove', ann});
      selectedAnnotation = null;
      updateAnnotationsList();
    }
  }
  if (e.key === 'Escape') deselectAll();
  // Tool shortcuts
  const shortcuts = {v:'select', t:'text', p:'pen', h:'highlighter', r:'rect', c:'circle', l:'line', e:'eraser', s:'stamp'};
  if (!e.ctrlKey && !e.metaKey && !e.altKey && !document.activeElement.isContentEditable) {
    const tool = shortcuts[e.key.toLowerCase()];
    if (tool) setTool(tool);
  }
});

// Init panel
setTool('select');
document.getElementById('props-text').style.display = 'none';
document.getElementById('props-draw').style.display = 'none';
document.getElementById('props-stamp').style.display = 'none';
</script>
